---
- name: Ensure ufw is installed
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Reset UFW to clean state
  community.general.ufw:
    state: reset

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port }}"
    proto: tcp
    comment: "SSH"

- name: Allow custom ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default('') }}"
  loop: "{{ firewall_allowed_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto | default('tcp') }}"

- name: Deny all incoming by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Allow all outgoing by default
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Set firewall logging level
  community.general.ufw:
    logging: "{{ firewall_logging }}"

- name: Enable firewall
  community.general.ufw:
    state: enabled
