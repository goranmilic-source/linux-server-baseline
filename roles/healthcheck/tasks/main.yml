---

- name: Install health-check script
  ansible.builtin.copy:
    src: healthcheck.sh
    dest: /usr/local/bin/healthcheck.sh
    owner: root
    group: root
    mode: "0755"

- name: Install health-check service unit
  ansible.builtin.template:
    src: healthcheck.service.j2
    dest: /etc/systemd/system/healthcheck.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install health-check timer unit
  ansible.builtin.template:
    src: healthcheck.timer.j2
    dest: /etc/systemd/system/healthcheck.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart healthcheck timer

- name: Apply systemd changes before enabling the timer
  ansible.builtin.meta: flush_handlers
  # This line runs any handlers right now.

- name: Enable and start health-check timer
  ansible.builtin.systemd_service:
    name: healthcheck.timer
    enabled: true
    state: started

- name: Install log rotation for health-checking log
  ansible.builtin.template:
    src: healthcheck.logrotate.j2
    dest: /etc/logrotate.d/healthcheck
    owner: root
    group: root
    mode: "0644"
